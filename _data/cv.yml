    Publications:
      - title: Silicon-on-Uranium-Oxide Substrate for Single Event Upset Evaluation
        authors:
          - David Fobar
          - K. Filip
          - S. Vitale
          - W. Koch
        publisher: Journal of Radiation Effects Research and Engineering, Vol. 44
        releaseDate: 2025-01-01
        summary: >-
          Discusses a novel method of preparing microelectronics for radiation hardness testing.
          The work is purely computational at this time and pending submission for patent review.

      - title: Development of a Pulsed UV-LED Calibration Technique for Scintillating Detectors
        authors:
          - T. Halbert
          - David Fobar
        publisher: Journal of Radiation Effects Research and Engineering, Vol. 44
        releaseDate: 2025-01-01
        summary: >-
          Introduces a method of conducting source-less energy calibration of radiation detectors
          using a small pulsed LED.

      - title: A Machine Learning Approach to a Multidetector Array Response Function for Nuclear Search
        url: /publications/#fobar2022multidetector
        authors:
          - David Fobar
          - W. Vanderlip
          - W. Koch
          - P. Chapman
        publisher: IEEE Transactions on Nuclear Science
        releaseDate: 2022-08-01
        summary: >-
          Investigated the novel use of machine learning to project a unit vector from an
          array of radiation detectors back to a point source.

      - title: Considerations for Training an Artificial Neural Network for Particle Type Identification
        url: /publications/#fobar2021ann
        authors:
          - David Fobar
          - A.S. Wilhelm
          - L. Phillips
          - P. Chapman
        publisher: IEEE Transactions on Nuclear Science
        releaseDate: 2021-09-01
        summary: >-
          Used machine learning to conduct pulse shape discrimination between neutron and
          gamma-ray radiation particles interacting in an organic scintillating radiation detector.

      - title: Robotic delivery of laser-induced breakdown spectroscopy for sensitive chlorine measurement in dry cask storage systems
        url: /publications/#fobar2018robotic
        authors:
          - David Fobar
          - X. Xiao
          - M. Burger
          - S. Le Berre
          - A. Motta
          - I. Jovanovic
        publisher: Progress in Nuclear Energy
        releaseDate: 2018-11-01
        summary: >-
          Developed a method of remotely characterizing chlorine deposition on the surface of
          stainless steel using dual-pulse LIBS for the in-situ inspection of dry-cask storage
          canisters of spent nuclear fuel.

      - title: Measurement of chlorine concentration on steel surfaces via fiber-optic laser-induced breakdown spectroscopy in double-pulse configuration
        url: /publications/#xiao2018measurement
        authors:
          - X. Xiao
          - S. Le Berre
          - David Fobar
          - M. Burger
          - P. Skrodzki
          - K. Hartig
          - A. Motta
          - I. Jovanovic
        publisher: Spectrochimica Acta Part B, Atomic Spectroscopy
        releaseDate: 2018-03-01
        summary: >-
          Developed a method of characterizing chlorine deposition on the surface of stainless
          steel using dual-pulse laser induced breakdown spectroscopy.

    Conference Presentations & Publications:
      - bullet: >-
          **Reconstructing Nuclear Fallout Fields with Scatterable Dosimeters**
          — K. Filip, D. Fobar, S. Ague. 2024 IEEE Long Island Systems, Applications and Technology Conference.
          Documented the wireless infrastructure and data processing necessary to localize
          sensors using differential time-of-arrival, filtered with a Kalman filter.

      - bullet: >-
          **Gamma ray directionality from a tightly packed scintillator array**
          — D. Fobar, W. Koch, T. Bruff, P. Chapman. Presentation at SORMA XIX, May 2023. Supplements the RADBOT
          capstone and extends the Aug 2022 published work, using a physics-informed loss
          function with probabilistic weighting of source location.

      - bullet: >-
          **Demonstration of a Low Power Imaging System for a Portable Time Projection Chamber**
          — W. Koch, D. Fobar, T. Bruff, P. Chapman. Presentation at HEART, April 2023; pending
          publication in JRERE. Aims to provide real-time localization of fast neutron sources, a
          key indicator for special nuclear material.

      - bullet: >-
          **Unsupervised Machine Learning Approaches to Nuclear Particle Type Classification**
          — N. Liebers, J. Huckelberry, D. Ruiz, D. Fobar, P. Chapman. IEEE LISAT Conference
          Proceedings, May 2022. An unsupervised ML algorithm developed by cadets during a joint
          EECS/PANE independent research project.

    Other Publications:
